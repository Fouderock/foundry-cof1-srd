  key: sac-sans-fond
  description: '<p><strong>Coût :</strong> 2 points de voie (rang 3)</p><p>Il éveille la matière en profondeur — non plus sa surface, mais son âme intérieure. Le Forgesort éveille la structure interne d''un contenant qu''il porte (sac, bourse, coffre, malle) — permanent.</p><ul><li><strong>Capacité</strong> : stocke jusqu''à 50 kg par rang de matériel sans jamais peser plus de 1 kg, sans changer de volume extérieur.</li><li><strong>Rangement animé</strong> : récupérer n''importe quel objet dedans est une action gratuite — l''objet voulu vient se placer dans sa main.</li></ul><p><em>Un sac de forgeron, une besace de campagne, un coffret d''apothicaire — le Forgesort porte sur lui bien plus que ce qu''un homme ordinaire peut soulever.</em></p>'
  source: Chroniques Oubliées DRS
