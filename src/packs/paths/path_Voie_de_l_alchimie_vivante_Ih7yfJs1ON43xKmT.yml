  description: '<h1>Description</h1><p>Le Forgesort commence par distiller la matière — plantes, minéraux, ingrédients. Puis il apprend qu''il peut faire plus : convaincre un objet de refuser de s''ouvrir, éveiller le vide d''un sac, tresser une corde qui obéit. À chaque rang, sa relation à la matière s''approfondit. Au bout du chemin, tout ce qui l''entoure lui répond.</p>'
