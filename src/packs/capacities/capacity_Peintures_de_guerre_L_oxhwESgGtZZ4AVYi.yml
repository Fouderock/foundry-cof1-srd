  description: '<h1>Description</h1><p><strong>Coût :</strong> 1 pt de voie · <strong>Accès :</strong> Niveau 3</p><p>Avant un combat (ou en 1 action limitée en urgence), le demi-orc trace des peintures rituelles sur lui-même et ses alliés. Chaque peinture dure 1 combat :</p><ul><li><strong>Rouge (sang)</strong> : +1 aux DM de mêlée</li><li><strong>Noir (cendre)</strong> : +1 DEF</li><li><strong>Blanc (os)</strong> : +2 aux tests contre la peur et les charmes</li><li><strong>Ocre (terre)</strong> : +1 RD</li></ul><p>Il peut peindre [Mod SAG] créatures (lui compris). Un même personnage ne peut porter qu''une seule peinture.</p>'
  source: Chroniques Oubliées DRS
