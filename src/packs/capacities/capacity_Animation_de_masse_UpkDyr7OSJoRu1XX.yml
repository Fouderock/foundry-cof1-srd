system:
  key: animation-de-masse
  description: '<p><strong>Coût :</strong> 2 points de voie (rang 5)</p><p>Il n''a plus besoin de préparer le terrain. D''un seul mot, il éveille la matière autour de lui et force le monde à lui obéir. <strong>Gain passif</strong> : +2 en <strong>INT</strong>.</p><p><strong>En combat (1/jour)</strong> : il anime tous les objets légers environnants (outils, chaises, cordes, pierres, vaisselle) dans une zone de 10 m de rayon autour de lui pendant 3 tours. La zone devient un terrain difficile.</p><p><strong>Effet sur les ennemis</strong> : à leur tour, les victimes dans la zone doivent réussir un test de <strong>DEX</strong> (difficulté [10 + Mod. d''<strong>INT</strong>]). En cas d''échec, elles subissent -4 en DEF, -4 en Initiative et prennent 1d6 <strong>DM</strong> d''impact. En cas de réussite, elles évitent les malus et ne subissent que la moitié des dégâts.</p>'
  source: Chroniques Oubliées DRS
