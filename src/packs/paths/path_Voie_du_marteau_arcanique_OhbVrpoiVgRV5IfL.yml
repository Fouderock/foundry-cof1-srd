system:
  key: voie-du-marteau-arcanique
  description: '<h1>Description</h1><p>Le Forgesort forge un marteau arcanique qui répond à sa main.</p><h2>Affinité élémentaire</h2><p>À la création de l''artefact, le Forgesort choisit définitivement un type de dégâts supplémentaire :</p><ul><li><strong>🔥 Forge d''ardeur (Feu)</strong> : +1d6 DM de feu. La cible subit également 1d4 DM de brûlure au début de son tour suivant. <em>RP : fond le métal et allume un brasier d''un simple contact.</em></li><li><strong>⚡ Fracas céleste (Foudre)</strong> : +1d6 DM de foudre (+2d6 contre une cible en armure métallique). Un coup frappé contre un obstacle (porte, mur) le fragilise ou le brise.</li><li><strong>❄️ Cœur de gel (Froid)</strong> : +1d6 DM de froid. 1/combat, sur une attaque réussie, le gel annule le prochain déplacement de la cible et lui inflige -2 aux jets d''attaque jusqu''à la fin de son prochain tour.</li></ul>'
  source: Chroniques Oubliées DRS
