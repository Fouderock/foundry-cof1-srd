system:
  key: voie-du-golem
  description: '<h1>Description</h1><p>Le golem gagne 1 emplacement de module au rang 2, un 2e au rang 3 et un 3e au rang 4 (3 max, dont 1 seul module spécial). À chaque rang, le Forgesort choisit UNE recette parmi les 3 proposées et la débloque définitivement. Fabrication à l''atelier. Installer/désinstaller : 10 min.</p><h2>Amélioration d''un module</h2><p>Gratuit, une seule fois, puis à nouveau aux niveaux 8 et 13 : le Forgesort choisit un de ses modules équipés et le renforce en permanence (portée étendue, dé de dégâts supplémentaire, effet renforcé — validation MJ).</p>'
  source: Chroniques Oubliées DRS
